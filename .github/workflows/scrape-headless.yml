name: Scrape headless-browser-only portals (MPSC, RBI)

on:
  schedule:
    - cron: "37 */6 * * *"   # every 6 hours, offset from scrape-tier1.yml's :17 so they don't contend for the same minute
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      INGEST_URL: https://bharatvacancy.com/ingest.php
      INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium

      - name: Run headless scraper
        timeout-minutes: 15
        run: python headless_portals.py
