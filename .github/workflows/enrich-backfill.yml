name: Enrich job pages via Groq

on:
  schedule:
    - cron: "37 */6 * * *"   # 4x/day, ~40 pages per run, stays inside Groq's free per-key limits
  workflow_dispatch: {}

permissions:
  contents: write   # commits enrich_state.json back so pages aren't retried forever

jobs:
  enrich:
    runs-on: ubuntu-latest
    env:
      INGEST_URL: https://bharatvacancy.com/ingest.php
      INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pypdf

      - name: Enrich pages
        timeout-minutes: 20
        run: python enrich_backfill.py

      - name: Commit updated enrichment state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add enrich_state.json
          git diff --cached --quiet || git commit -m "Update enrichment state [skip ci]"
          git pull --rebase origin main
          git push
